name: Aetherforge (ClaudeMobile) — check, build, deploy

on:
  push:
    branches: [main, claude/one-shot-mobile]
    paths: ['ClaudeMobile/**', '.github/workflows/claude-mobile.yml']
  pull_request:
    paths: ['ClaudeMobile/**', '.github/workflows/claude-mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ClaudeMobile

jobs:
  check:
    name: Lint, typecheck, test, build, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ClaudeMobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests (simulation, saves, offline, full playthrough bot)
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end smoke tests (phone + desktop)
        run: npx playwright test
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ClaudeMobile/playwright-report
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ClaudeMobile/dist

  deploy:
    name: Deploy PWA to GitHub Pages
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4

  android:
    name: Android debug APK
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ClaudeMobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Gradle assembleDebug
        working-directory: ClaudeMobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: aetherforge-debug-apk
          path: ClaudeMobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
